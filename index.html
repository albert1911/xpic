<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X Pic Grabber</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --text: #e8eaed; --dim: #8b93a1;
    --accent: #1d9bf0; --err: #f4727c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 8px 0 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=url], input[type=text] {
    flex: 1 1 240px; min-width: 0; font-size: 16px; /* 16px stops iOS zoom-on-focus */ padding: 12px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  }
  input[type=url]:focus, input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button, a.btn {
    padding: 12px 16px; font: inherit; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; cursor: pointer; text-decoration: none; text-align: center;
  }
  button.ghost, a.btn.ghost { background: var(--card); border: 1px solid var(--line); color: var(--text); }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin: 16px 0; color: var(--dim); min-height: 1.4em; }
  #status.err { color: var(--err); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 8px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item img { display: block; width: 100%; max-height: 360px; object-fit: contain; background: #000; }
  .item .row { display: flex; gap: 8px; padding: 8px; }
  .item .row > * { flex: 1; padding: 8px; font-size: .9rem; }
  small { color: var(--dim); }
  details { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  summary { cursor: pointer; color: var(--dim); }
  details label { display: block; margin-top: 12px; font-size: .9rem; color: var(--dim); }
  details label input[type=text] { width: 100%; margin-top: 4px; }
  details label.check { display: flex; gap: 10px; align-items: center; color: var(--text); font-size: 1rem; }
  input[type=checkbox] {
    flex: none; width: 20px; height: 20px; min-width: 20px; padding: 0; margin: 0;
    accent-color: var(--accent); cursor: pointer;
  }
  details small { display: block; margin-top: 12px; }
  .bar { flex-wrap: wrap; gap: 8px; }
  .bar .btns { display: flex; gap: 8px; }
  code { word-break: break-all; }

  @media (max-width: 520px) {
    body { padding-left: 12px; padding-right: 12px; }
    form > * { flex: 1 1 100%; }
    form #paste { order: 3; }
    .bar { flex-direction: column; align-items: stretch; }
    .bar .btns > * { flex: 1; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<main>
  <h1>X Pic Grabber</h1>
  <form id="form">
    <input id="url" type="url" inputmode="url" placeholder="https://x.com/user/status/123…" autocomplete="off" required>
    <button id="go" type="submit">Get images</button>
    <button id="paste" type="button" class="ghost">Paste</button>
  </form>
  <div id="status"></div>
  <div id="result" hidden>
    <div class="bar"><small id="count"></small>
      <div class="btns">
        <button id="drive" type="button">Save to Drive</button>
        <button id="all" class="ghost" type="button">Download all</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <details id="settings">
    <summary>Google Drive settings</summary>
    <label>OAuth Client ID (see README)
      <input type="text" id="clientId" placeholder="123456-abc.apps.googleusercontent.com" autocomplete="off">
    </label>
    <label>Drive folder (nested with /, <code>{user}</code> = post author)
      <input type="text" id="folder" placeholder="XPic" autocomplete="off">
    </label>
    <label class="check"><input type="checkbox" id="auto"> Auto-save to Drive after fetching</label>
    <small>Override per link with <code>?folder=Memes/Cats</code> or <code>?auto=0</code>.</small>
  </details>
</main>

<script>
const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const q = new URLSearchParams(location.search);
const SCOPE = "https://www.googleapis.com/auth/drive.file"; // only files/folders this app creates

const cfg = {
  get: (k, d = "") => { try { return localStorage.getItem("xpic." + k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem("xpic." + k, v); } catch {} },
};
let current = { user: "", id: "", urls: [] };

const setStatus = (msg, err = false) => { statusEl.textContent = msg; statusEl.className = err ? "err" : ""; };

function parse(text) {
  const m = text.match(/(?:x|twitter)\.com\/([^/?#\s]+)\/status\/(\d+)/i);
  return m && { user: m[1], id: m[2] };
}

// Returns image URLs (video posts give their thumbnail).
async function fetchImages({ user, id }) {
  const res = await fetch(`https://api.fxtwitter.com/${user}/status/${id}`);
  if (res.status === 404) throw new Error("Post not found (deleted or private?)");
  if (!res.ok) throw new Error(`Lookup failed (${res.status})`);
  const { tweet } = await res.json();
  const media = tweet?.media?.all ?? [];
  return media.map((x) => (x.type === "photo" ? x.url : x.thumbnail_url)).filter(Boolean);
}

const withSize = (u, name) => (u.includes("pbs.twimg.com") ? `${u.split("?")[0]}?name=${name}` : u);
const extOf = (u) => (u.split("?")[0].match(/\.(jpe?g|png|webp|gif)$/i)?.[0] ?? ".jpg");

const fileName = (u, i) => `${current.user}-${current.id}-${i + 1}${extOf(u)}`;

// ---- Google Drive ----
let token = null, tokenExp = 0;

function getToken() {
  return new Promise((resolve, reject) => {
    if (token && Date.now() < tokenExp) return resolve(token);
    const clientId = cfg.get("clientId");
    if (!clientId) return reject(new Error("Add your Google Client ID in Drive settings."));
    if (!window.google?.accounts) return reject(new Error("Google sign-in didn't load (offline?)."));
    google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: SCOPE,
      callback: (r) => {
        if (!r.access_token) return reject(new Error(r.error_description || r.error || "Sign-in failed."));
        token = r.access_token;
        tokenExp = Date.now() + (r.expires_in - 60) * 1000;
        resolve(token);
      },
      error_callback: (e) => reject(new Error(
        e.type === "popup_closed" ? "Sign-in cancelled." : "Sign-in popup blocked. Tap Save to Drive."
      )),
    }).requestAccessToken({ prompt: "" });
  });
}

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...opts.headers, Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error(`Drive error ${r.status}`);
  return r.json();
}
const esc = (s) => s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
const list = (query) =>
  api(`https://www.googleapis.com/drive/v3/files?fields=files(id)&q=${encodeURIComponent(query)}`);

function folderPath() {
  const raw = q.get("folder") ?? cfg.get("folder", "XPic");
  return raw.replaceAll("{user}", current.user);
}

// Finds or creates each folder in the path, returns the last folder's id.
async function ensureFolder(path) {
  let parent = "root";
  for (const name of path.split("/").map((s) => s.trim()).filter(Boolean)) {
    const { files } = await list(
      `name='${esc(name)}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`);
    parent = files[0]?.id ?? (await api("https://www.googleapis.com/drive/v3/files?fields=id", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, mimeType: "application/vnd.google-apps.folder", parents: [parent] }),
    })).id;
  }
  return parent;
}

async function uploadOne(folderId, u, i) {
  const name = fileName(u, i);
  const { files } = await list(`name='${esc(name)}' and '${folderId}' in parents and trashed=false`);
  if (files.length) return; // already saved
  const blob = await (await fetch(withSize(u, "orig"))).blob();
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({ name, parents: [folderId] })], { type: "application/json" }));
  form.append("file", blob);
  await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", body: form });
}

async function saveToDrive() {
  if (!current.urls.length) return;
  $("drive").disabled = true;
  try {
    setStatus("Connecting to Google Drive…");
    await getToken();
    const path = folderPath();
    setStatus(`Saving to Drive/${path}…`);
    const folderId = await ensureFolder(path);
    const failed = [];
    for (const [i, u] of current.urls.entries()) {
      try { await uploadOne(folderId, u, i); } catch { failed.push(i + 1); }
    }
    const n = current.urls.length;
    setStatus(failed.length
      ? `Saved ${n - failed.length}/${n} to Drive/${path}. Failed: #${failed.join(", #")}`
      : `Saved ${n} image${n === 1 ? "" : "s"} to Drive/${path}`, failed.length > 0);
  } catch (e) {
    setStatus(e.message || "Drive save failed.", true);
  } finally {
    $("drive").disabled = false;
  }
}

async function save(u, i) {
  const full = withSize(u, "orig");
  try {
    const blob = await (await fetch(full)).blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName(u, i);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch {
    window.open(full, "_blank", "noopener"); // CORS/blocked: open it so you can save manually
  }
}

function render() {
  const grid = $("grid");
  grid.replaceChildren();
  current.urls.forEach((u, i) => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<img alt="" loading="lazy"><div class="row">
      <button type="button">Download</button>
      <a class="btn ghost" target="_blank" rel="noopener">Open</a></div>`;
    el.querySelector("img").src = withSize(u, "large");
    el.querySelector("button").onclick = () => save(u, i);
    el.querySelector("a").href = withSize(u, "orig");
    grid.append(el);
  });
  $("count").textContent = `${current.urls.length} image${current.urls.length === 1 ? "" : "s"}`;
  $("result").hidden = false;
}

async function run(text) {
  const p = parse(text);
  $("result").hidden = true;
  if (!p) return setStatus("That doesn't look like an X post link.", true);
  $("go").disabled = true;
  setStatus("Fetching…");
  try {
    const urls = await fetchImages(p);
    if (!urls.length) return setStatus("No images in that post.", true);
    current = { ...p, urls };
    setStatus("");
    render();
    if (cfg.get("auto", "1") === "1" && q.get("auto") !== "0") saveToDrive();
  } catch (e) {
    setStatus(e.message || "Something went wrong.", true);
  } finally {
    $("go").disabled = false;
  }
}

$("form").onsubmit = (e) => { e.preventDefault(); run($("url").value.trim()); };
$("paste").onclick = async () => {
  try { $("url").value = (await navigator.clipboard.readText()).trim(); $("form").requestSubmit(); }
  catch { setStatus("Clipboard blocked — paste into the box manually.", true); }
};
$("all").onclick = async () => {
  for (const [i, u] of current.urls.entries()) { await save(u, i); await new Promise((r) => setTimeout(r, 300)); }
};

$("drive").onclick = saveToDrive;

// Settings (saved on change)
$("clientId").value = cfg.get("clientId");
$("folder").value = cfg.get("folder", "XPic");
$("auto").checked = cfg.get("auto", "1") === "1";
$("clientId").onchange = (e) => cfg.set("clientId", e.target.value.trim());
$("folder").onchange = (e) => cfg.set("folder", e.target.value.trim());
$("auto").onchange = (e) => cfg.set("auto", e.target.checked ? "1" : "0");
if (!cfg.get("clientId")) $("settings").open = true;

// Opened via share sheet (?url= / ?text=) or ?u=
const shared = q.get("url") || q.get("text") || q.get("u");
if (shared) {
  $("url").value = shared;
  run(shared);
  const keep = new URLSearchParams();
  for (const k of ["folder", "auto"]) if (q.has(k)) keep.set(k, q.get(k));
  history.replaceState(null, "", location.pathname + (keep.size ? `?${keep}` : ""));
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
